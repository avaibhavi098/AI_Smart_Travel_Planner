<!DOCTYPE html>

<html>

<head>

<title>403 - Forbidden</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{

margin:0;
font-family:Arial;
background:#fef2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}


.box{

background:white;
padding:40px;
border-radius:25px;
text-align:center;
width:90%;
max-width:500px;
box-shadow:0 10px 30px rgba(0,0,0,.1);

}


h1{

font-size:60px;
color:#dc2626;

}


h2{

color:#1e293b;

}


p{

color:#64748b;

}


a{

background:#dc2626;
color:white;
padding:12px 25px;
border-radius:50px;
text-decoration:none;
display:inline-block;
margin-top:20px;

}

</style>


</head>


<body>


<div class="box">


<h1>

403

</h1>


<h2>

Access Denied

</h2>


<p>

You don't have permission to access this page.

</p>


<a href="/">

Go Home

</a>


</div>


</body>


</html>
