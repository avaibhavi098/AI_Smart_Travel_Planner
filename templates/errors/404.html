<!DOCTYPE html>

<html>

<head>

<title>404 - Page Not Found</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{

margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif;
background:#f1f5ff;

display:flex;
align-items:center;
justify-content:center;

min-height:100vh;

}


.error-box{

background:white;

width:90%;
max-width:550px;

padding:45px 30px;

border-radius:25px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.12);

}


.icon{

font-size:80px;

}


h1{

font-size:70px;

margin:15px 0;

color:#2563eb;

}


h2{

color:#1e293b;

}


p{

color:#64748b;

font-size:16px;

line-height:1.6;

}


.btn{

display:inline-block;

margin-top:25px;

background:#2563eb;

color:white;

padding:14px 30px;

border-radius:50px;

text-decoration:none;

font-weight:bold;

}


.btn:hover{

background:#1d4ed8;

}



@media(max-width:600px){


h1{

font-size:50px;

}


.icon{

font-size:60px;

}


.error-box{

padding:35px 20px;

}


}



</style>


</head>


<body>


<div class="error-box">


<div class="icon">

✈️

</div>


<h1>

404

</h1>


<h2>

Page Not Found

</h2>


<p>

Oops! The page you are looking for does not exist or may have been removed.

</p>


<a href="/" class="btn">

Go Home

</a>


</div>


</body>


</html>
