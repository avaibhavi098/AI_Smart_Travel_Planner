<!DOCTYPE html>

<html>

<head>

<title>500 - Server Error</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{

margin:0;
font-family:Arial;
background:#eff6ff;

display:flex;
justify-content:center;
align-items:center;
height:100vh;

}


.box{

background:white;
padding:40px;
border-radius:25px;
text-align:center;
max-width:500px;
width:90%;
box-shadow:0 10px 30px rgba(0,0,0,.1);

}


h1{

font-size:60px;
color:#2563eb;

}


h2{

color:#1e293b;

}


p{

color:#64748b;

}


a{

background:#2563eb;
color:white;
padding:12px 25px;
border-radius:50px;
text-decoration:none;
display:inline-block;
margin-top:20px;

}


</style>


</head>


<body>


<div class="box">


<h1>

500

</h1>


<h2>

Something Went Wrong

</h2>


<p>

Our server encountered an unexpected error. Please try again later.

</p>


<a href="/">

Back To Home

</a>


</div>


</body>


</html>
