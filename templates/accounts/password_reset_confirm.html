{% extends "base.html" %}

{% block title %}
Set New Password
{% endblock %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow rounded-4">

<div class="card-body p-5">

<h2 class="fw-bold text-center mb-4">
Set New Password
</h2>


<form method="POST">

{% csrf_token %}


{{ form.as_p }}


<button class="btn btn-primary w-100 rounded-pill">
Change Password
</button>


</form>


</div>

</div>

</div>

</div>

</div>

{% endblock %}
