<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="
margin:0;
padding:0;
background:#f1f5ff;
font-family:Arial,Helvetica,sans-serif;
">

<table width="100%" cellpadding="0" cellspacing="0">
<tr>
<td align="center" style="padding:20px;">

<table width="100%" 
style="
max-width:600px;
background:white;
border-radius:20px;
overflow:hidden;
padding:35px;
">

<tr>
<td align="center">

<h1 style="
color:#2563eb;
font-size:28px;
margin-bottom:25px;
">

✈️ AI Smart Travel Planner

</h1>


<h2 style="
font-size:22px;
color:#1e293b;
">

Password Reset Request

</h2>


<p style="
font-size:16px;
color:#475569;
">

Hello {{ user.username }},

</p>


<p style="
font-size:16px;
color:#475569;
line-height:1.6;
">

We received a request to reset your password.

</p>



<table width="100%">
<tr>
<td align="center" style="padding:25px 0;">


<a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"

style="
display:inline-block;
background:#2563eb;
color:white;
padding:14px 30px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
font-size:16px;
">

Reset Password

</a>


</td>
</tr>
</table>



<p style="
font-size:14px;
color:#64748b;
line-height:1.5;
">

If you did not request this password reset, please ignore this email.

</p>



<hr style="
border:none;
border-top:1px solid #e2e8f0;
margin:25px 0;
">


<p style="
font-size:14px;
color:#64748b;
text-align:center;
">

AI Smart Travel Planner ❤️

</p>


</td>
</tr>

</table>

</td>
</tr>

</table>


</body>

</html>
